    <rect width="48" height="48" rx="12" fill="#245B38" stroke="#4F8A4B" stroke-width="1.5"/>
    <!-- Vertical Stalk -->
    <path d="M14 11C14 10.4477 14.4477 10 15 10H18C18.5523 10 19 10.4477 19 11V37C19 37.5523 18.5523 38 18 38H15C14.4477 38 14 37.5523 14 37V11Z" fill="#FFFFFF"/>
