  <text x="64" y="32" font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="22" letter-spacing="-0.02em" fill="#FFFFFF">THE KHEDUT</text>
  <text x="64" y="45" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="9" letter-spacing="0.16em" fill="#A5C96A">SMART AGRICULTURE PLATFORM</text>
